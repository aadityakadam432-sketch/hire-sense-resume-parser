<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}HireSense{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <a class="brand" href="{{ url_for('index') }}">HireSense</a>
  <nav><a href="{{ url_for('index') }}">Upload</a><a href="{{ url_for('resumes') }}">History</a></nav>
</header>
<main class="container">
{% with messages = get_flashed_messages() %}
  {% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>Python • Flask • NLP • SQLite</footer>
</body>
</html>
